databases:
  - name: eglise-saas-db
    plan: free
    databaseName: eglise_saas
    ipAllowList: []

services:
  - type: web
    name: eglise-saas
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn eglise_saas_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eglise-saas-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.2"
