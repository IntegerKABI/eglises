{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Connexion{% endblock %}

{% block content %}
<!-- Skeleton -->
<div class="skeleton-container">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-body p-5 text-center">
                        <div class="skeleton skeleton-avatar mx-auto mb-3" style="width:70px; height:70px;"></div>
                        <div class="skeleton skeleton-title mx-auto"></div>
                        <div class="skeleton skeleton-text mx-auto w-75 mb-4"></div>
                        <div class="skeleton mb-3" style="height:38px; width:100%;"></div>
                        <div class="skeleton mb-3" style="height:38px; width:100%;"></div>
                        <div class="skeleton" style="height:48px; width:100%; border-radius:.375rem;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Rendered content -->
<div class="page-content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-church display-4 text-church"></i>
                            <h2 class="mt-2">Connexion</h2>
                            <p class="text-muted">Accédez au tableau de bord de votre église</p>
                        </div>
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <button type="submit" class="btn btn-church btn-lg w-100 mt-3">
                                <i class="bi bi-box-arrow-in-right"></i> Se connecter
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
