{% extends "base.html" %}
{% block title %}Invitation — {{ church.name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">Accepter l'invitation</h1>
                    <p class="text-muted mb-4">
                        Vous avez été invité à rejoindre <strong>{{ church.name }}</strong> en tant que
                        <strong>{{ invite.get_role_display }}</strong>.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-church btn-lg">
                            <i class="bi bi-check-lg"></i> Accepter
                        </button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-lg ms-2">
                            <i class="bi bi-arrow-left"></i> Annuler
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
