{% extends "base.html" %}
{% block title %}Sélectionner une église{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3"><i class="bi bi-building"></i> Sélectionner une église</h1>
                    <p class="text-muted">Choisissez l'église à administrer.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="list-group mb-4">
                            {% for church in churches %}
                            <label class="list-group-item d-flex align-items-center gap-2">
                                <input class="form-check-input" type="radio" name="church_id" value="{{ church.id }}" {% if church.id == selected_church_id %}checked{% endif %} required>
                                <span>
                                    <strong>{{ church.name }}</strong><br>
                                    <small class="text-muted">{{ church.city|default:"—" }}, {{ church.country }}</small>
                                </span>
                            </label>
                            {% endfor %}
                        </div>
                        <button type="submit" class="btn btn-church">
                            <i class="bi bi-check-lg"></i> Continuer
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
