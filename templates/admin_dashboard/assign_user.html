{% extends "admin_dashboard/base_dashboard.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }} — {{ church.name }}{% endblock %}

{% block dashboard_content %}
<div class="page-content">
<h1 class="mb-4"><i class="bi bi-link-45deg"></i> {{ title }}</h1>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="post" data-ajax>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-3">
                <button type="submit" class="btn btn-church btn-lg">
                    <i class="bi bi-check-lg"></i> Assigner
                </button>
                <a href="{% url 'manage_users' %}" class="btn btn-outline-secondary btn-lg ms-2">
                    <i class="bi bi-arrow-left"></i> Annuler
                </a>
            </div>
        </form>
    </div>
</div>
</div>
{% endblock %}
