services:
  postgres:
    image: postgres:16-alpine
    container_name: eglise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eglise_saas}
      POSTGRES_USER: ${POSTGRES_USER:-eglise_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eglise-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-eglise_user} -d ${POSTGRES_DB:-eglise_saas}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eglise-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
